<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rezepte Galerie">
    <title>Rezepte</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🍽️ Rezepte Galerie</h1>
        </header>

        <!-- Navigation -->
        <nav class="nav-menu">
            <button class="nav-btn active" data-recipe="zitronenkuchen">🍰 Zitronenkuchen</button>
            <button class="nav-btn" data-recipe="tomatensuppe">🍲 Tomatensuppe</button>
            <button class="nav-btn" data-recipe="caesarsalat">🥗 Caesar Salat</button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Zitronenkuchen Gallery -->
            <section class="gallery" id="zitronenkuchen" style="display: block;">
                <h2>Saftiger Zitronenkuchen</h2>
                <div class="image-grid">
                    <div class="image-card">
                        <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&w=500&h=500&fit=crop" alt="Zitronenkuchen 1">
                    </div>
                    <div class="image-card">
                        <img src="https://www.einfachbacken.de/sites/einfachbacken.de/files/styles/973_730/public/2018-08/zitronenkuchen-2.jpg?h=a1e1a043&itok=ajJFb8r_" alt="Zitronenkuchen 2">
                    </div>
                    <div class="image-card">
                        <img src="https://heyfoodsister.de/wp-content/uploads/2023/07/LimoncelloGugelhupf0218-scaled.jpg" alt="Zitronenkuchen 3">
                    </div>
                </div>
            </section>

            <!-- Tomatensuppe Gallery -->
            <section class="gallery hidden" id="tomatensuppe">
                <h2>Cremige Tomatensuppe</h2>
                <div class="image-grid">
                    <div class="image-card">
                        <img src="https://images.unsplash.com/photo-1547592166-23ac45744acd?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&w=500&h=500&fit=crop" alt="Tomatensuppe 1">
                    </div>
                    <div class="image-card">
                        <img src="https://www.gutekueche.at/storage/media/recipe/145159/resp/leichte-tomatensuppe___webp_940_627.webp" alt="Tomatensuppe 2">
                    </div>
                    <div class="image-card">
                        <img src="https://www.smarticular.net/wp-content/uploads/2019/09/tomatensuppe-aus-frischen-tomaten-1-fb.jpg" alt="Tomatensuppe 3">
                    </div>
                </div>
            </section>

            <!-- Caesar Salat Gallery -->
            <section class="gallery hidden" id="caesarsalat">
                <h2>Klassischer Caesar Salat</h2>
                <div class="image-grid">
                    <div class="image-card">
                        <img src="https://images.unsplash.com/photo-1550304943-4f24f54ddde9?ixlib=rb-4.0.3&w=500&h=500&fit=crop" alt="Caesar Salat 1">
                    </div>
                    <div class="image-card">
                        <img src="https://abnehmtricks-und-abnehmtipps.de/wp-content/uploads/2024/08/Ceasar-Salad-12-1024x682.jpg" alt="Caesar Salat 2">
                    </div>
                    <div class="image-card">
                        <img src="https://www.einfachkochen.de/sites/einfachkochen.de/files/styles/full_width_tablet_4_3/public/2021-06/klassischer_caesar_salad_1_0.jpg?h=a1e1a043&itok=F0pP6dCZ" alt="Caesar Salat 3">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
</body>
</html>
